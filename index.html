<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='A typical traffic light'>
    <title>Traffic Light</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <p></p>
        <ul>
            <li>0</li>
            <li>0</li>
            <li>0</li>
        </ul>
    </main>

    <script>
        const red = document.querySelector("li:first-child")
        const yellow = document.querySelector("li:nth-child(2)")
        const green = document.querySelector("li:last-child")

        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
        }

        function startCounter(el) {
            let second = Number(el.textContent)

            const i = setInterval(() => {
                second++
                el.textContent = second
            }, 1000)


            return () => {
                el.textContent = 0
                clearInterval(i)
            }
        }

        const start = async () => {
            while (true) {
                green.classList.remove('green')
                red.classList.add('red')

                const stopRedCounter = startCounter(red)
                await wait(3000)
                stopRedCounter()

                red.classList.remove('red')
                yellow.classList.add('yellow')

                const stopYellowCounter = startCounter(yellow)
                await wait(2000)
                stopYellowCounter()

                yellow.classList.remove('yellow')
                green.classList.add('green')

                const stopGreenCounter = startCounter(green)
                await wait(3000)
                stopGreenCounter()
            }
        }

        start()
    </script>
</body>

</html>
